<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC AI Trader</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header>
  <h1>🎯 SMC AI Trader</h1>
  <div class="controls">
    <input id="symbol" value="BTC-USD" placeholder="Symbol">
    <select id="timeframe">
      <option value="15m">15m</option>
      <option value="1h" selected>1h</option>
      <option value="4h">4h</option>
      <option value="1d">1d</option>
    </select>
    <button id="analyze">Analyze</button>
  </div>
</header>
<main>
  <div id="chart"></div>
  <div id="signal"></div>
</main>
<style>
body{margin:0;background:#0b0f17;color:#e6edf7;font-family:-apple-system,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#131826;flex-wrap:wrap;gap:10px;border-bottom:1px solid #232b40}
h1{font-size:16px;margin:0}
input,select,button{background:#1a2035;color:#e6edf7;border:1px solid #232b40;padding:8px 12px;border-radius:8px;font-size:13px}
button{background:#4f8cff;cursor:pointer;font-weight:600}
main{display:grid;grid-template-columns:1fr 320px;gap:12px;padding:12px;height:calc(100vh - 65px)}
#chart{background:#131826;border-radius:12px;height:100%}
#signal{background:#131826;border-radius:12px;padding:16px;overflow-y:auto}
.bias{font-size:20px;font-weight:700;margin-bottom:10px}
.bullish{color:#16c784}.bearish{color:#ea3943}.neutral{color:#8a94a8}
.row{display:flex;justify-content:space-between;padding:6px 10px;background:#1a2035;border-radius:6px;margin:4px 0;font-size:13px}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}#chart{height:55vh}}
</style>
<script src="/static/app.js"></script>
</body>
</html>
