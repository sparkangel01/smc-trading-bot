<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC AI Trader</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f17; color: #e6edf7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { display: flex; justify-content: space-between; align-items: center;
  padding: 14px; background: #131826; border-bottom: 1px solid #232b40;
  flex-wrap: wrap; gap: 10px; }
h1 { font-size: 16px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
input, select, button { background: #1a2035; color: #e6edf7;
  border: 1px solid #232b40; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
input { width: 130px; }
button { background: #4f8cff; border: none; cursor: pointer; font-weight: 600; }
main { display: grid; grid-template-columns: 1fr 340px; gap: 12px; padding: 12px;
  height: calc(100vh - 65px); }
#chart { background: #131826; border-radius: 12px; height: 100%; position: relative; }
#loader { position: absolute; inset: 0; display: none; align-items: center;
  justify-content: center; background: rgba(11,15,23,0.7); color: #4f8cff;
  font-weight: 600; border-radius: 12px; }
#loader.on { display: flex; }
#signal { background: #131826; border-radius: 12px; padding: 14px; overflow-y: auto; }
.sig-title { font-size: 12px; text-transform: uppercase; color: #8a94a8;
  letter-spacing: 1px; margin-bottom: 10px; }
.bias { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.bullish { color: #16c784; }
.bearish { color: #ea3943; }
.neutral { color: #8a94a8; }
.bar { height: 8px; background: #1a2035; border-radius: 4px;
  overflow: hidden; margin: 8px 0; }
.fill { height: 100%; background: linear-gradient(90deg, #4f8cff, #16c784);
  transition: width 0.5s; }
.row { display: flex; justify-content: space-between; padding: 6px 10px;
  background: #1a2035; border-radius: 6px; margin: 4px 0; font-size: 13px; }
.row .lbl { color: #8a94a8; }
.reasons { list-style: none; font-size: 12px; color: #8a94a8; margin-top: 10px; }
.reasons li { padding: 3px 0 3px 14px; position: relative; }
.reasons li::before { content: "▸"; position: absolute; left: 0; color: #4f8cff; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; }
  #chart { height: 55vh; } }
</style>
</head>
<body>
<header>
  <h1>🎯 SMC AI Trader</h1>
  <div class="controls">
    <input id="symbol" value="BTC-USD" placeholder="Symbol">
    <select id="timeframe">
      <option value="15m">15m</option>
      <option value="1h" selected>1h</option>
      <option value="4h">4h</option>
      <option value="1d">1d</option>
    </select>
    <button id="analyze">Analyze</button>
  </div>
</header>
<main>
  <div id="chart"><div id="loader">Analyzing…</div></div>
  <div id="signal">
    <div class="sig-title">AI Signal</div>
    <div id="signal-content">Tap Analyze to start</div>
  </div>
</main>
<script>
let chart, series;
let obLines = [], fvgLines = [];

function initChart() {
  const container = document.getElementById("chart");
  chart = LightweightCharts.createChart(container, {
    layout: { background: { color: "#131826" }, textColor: "#e6edf7" },
    grid: { vertLines: { color: "#1a2035" }, horzLines: { color: "#1a2035" } },
    timeScale: { borderColor: "#232b40", timeVisible: true },
    rightPriceScale: { borderColor: "#232b40" },
  });
  series = chart.addCandlestickSeries({
    upColor: "#16c784", downColor: "#ea3943",
    borderUpColor: "#16c784", borderDownColor: "#ea3943",
    wickUpColor: "#16c784", wickDownColor: "#ea3943",
  });
  window.addEventListener("resize", () => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });
}

function ts(t) {
  const d = new Date(t);
  return isNaN(d.getTime()) ? Math.floor(Date.now() / 1000) : Math.floor(d.getTime() / 1000);
}

function fmt(v) {
  if (v == null) return "—";
  const n = Number(v);
  if (n < 10) return n.toFixed(5);
  if (n < 1000) return n.toFixed(2);
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function drawSignal(sig) {
  const box = document.getElementById("signal-content");
  const bias = sig.bias || "neutral";
  const conf = sig.confidence || 0;
  box.innerHTML = `
    <div class="bias ${bias}">${bias === "bullish" ? "▲" : bias === "bearish" ? "▼" : "■"} ${bias.toUpperCase()}</div>
    <div class="bar"><div class="fill" style="width:${conf}%"></div></div>
    <div style="font-size:12px;color:#8a94a8">Confidence: ${conf}%</div>
    <div class="row"><span class="lbl">Entry</span><strong>${fmt(sig.entry)}</strong></div>
    <div class="row"><span class="lbl">Stop Loss</span><strong>${fmt(sig.stop_loss)}</strong></div>
    <div class="row"><span class="lbl">TP1</span><strong>${fmt(sig.take_profit_1)}</strong></div>
    <div class="row"><span class="lbl">TP2</span><strong>${fmt(sig.take_profit_2)}</strong></div>
    <ul class="reasons">${(sig.reasons || []).map(r => `<li>${r}</li>`).join("")}</ul>
  `;
}

async function analyze() {
  const symbol = document.getElementById("symbol").value.trim().toUpperCase();
  const timeframe = document.getElementById("timeframe").value;
  document.getElementById("loader").classList.add("on");
  try {
    const res = await fetch(`/api/analyze?symbol=${encodeURIComponent(symbol)}&timeframe=${timeframe}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Failed");

    obLines.forEach(l => series.removePriceLine(l));
    fvgLines.forEach(l => series.removePriceLine(l));
    obLines = []; fvgLines = [];

    series.setData(data.candles.map(c => ({
      time: ts(c.time), open: c.open, high: c.high, low: c.low, close: c.close,
    })));
    chart.timeScale().fitContent();

    data.order_blocks.filter(o => !o.mitigated).slice(-6).forEach(o => {
      obLines.push(series.createPriceLine({
        price: o.top,
        color: o.kind === "bullish" ? "rgba(22,199,132,0.7)" : "rgba(234,57,67,0.7)",
        lineWidth: 2, lineStyle: 0, axisLabelVisible: true,
        title: o.kind === "bullish" ? "Bull OB" : "Bear OB",
      }));
    });

    data.fvgs.filter(f => !f.filled).slice(-6).forEach(f => {
      fvgLines.push(series.createPriceLine({
        price: (f.top + f.bottom) / 2,
        color: f.kind === "bullish" ? "rgba(79,140,255,0.5)" : "rgba(255,179,71,0.5)",
        lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: "",
      }));
    });

    drawSignal(data.signal);
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    document.getElementById("loader").classList.remove("on");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  initChart();
  document.getElementById("analyze").addEventListener("click", analyze);
  setTimeout(analyze, 500);
});
</script>
</body>
</html>
