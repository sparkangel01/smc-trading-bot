<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex SMC Trader</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f17; color: #e6edf7; font-family: -apple-system, sans-serif; }
header { display: flex; gap: 8px; padding: 12px; background: #131826;
  align-items: center; flex-wrap: wrap; border-bottom: 1px solid #232b40; }
input, select, button { background: #1a2035; color: #e6edf7; border: 1px solid #232b40;
  padding: 10px 12px; border-radius: 6px; font-size: 14px; }
input { width: 130px; }
button { background: #4f8cff; border: none; font-weight: 600; cursor: pointer; }
main { padding: 12px; }
#chart { height: 55vh; background: #131826; border-radius: 10px; }
.card { background: #131826; border-radius: 10px; padding: 16px; margin-top: 12px; }
.action { font-size: 32px; font-weight: 800; text-align: center; padding: 16px;
  border-radius: 10px; margin-bottom: 14px; letter-spacing: 2px; }
.buy  { background: rgba(22,199,132,0.15); color: #16c784; }
.sell { background: rgba(234,57,67,0.15);  color: #ea3943; }
.wait { background: rgba(138,148,168,0.15); color: #8a94a8; }
.row { display: flex; justify-content: space-between; padding: 10px 12px;
  background: #1a2035; border-radius: 6px; margin: 5px 0; font-size: 14px; }
.row .lbl { color: #8a94a8; }
.reasons { list-style: none; font-size: 13px; color: #8a94a8; margin-top: 12px; }
.reasons li { padding: 4px 0 4px 16px; position: relative; }
.reasons li::before { content: "→"; position: absolute; left: 0; color: #4f8cff; }
</style>
</head>
<body>
<header>
  <input id="symbol" value="EURUSD" placeholder="EURUSD">
  <select id="interval">
    <option value="15m">15m</option>
    <option value="1h">1H</option>
    <option value="4h" selected>4H</option>
    <option value="1d">1D</option>
  </select>
  <button id="analyze">Analyze</button>
</header>
<main>
  <div id="chart"></div>
  <div id="output"></div>
</main>
<script>
let chart, series;
let lines = [];

function initChart() {
  chart = LightweightCharts.createChart(document.getElementById("chart"), {
    layout: { background: { color: "#131826" }, textColor: "#e6edf7" },
    grid: { vertLines: { color: "#1a2035" }, horzLines: { color: "#1a2035" } },
    timeScale: { timeVisible: true, borderColor: "#232b40" },
    rightPriceScale: { borderColor: "#232b40" },
  });
  series = chart.addCandlestickSeries({
    upColor: "#16c784", downColor: "#ea3943",
    borderUpColor: "#16c784", borderDownColor: "#ea3943",
    wickUpColor: "#16c784", wickDownColor: "#ea3943",
  });
}

function ts(s) {
  const d = new Date(s.replace(" ", "T"));
  return isNaN(d) ? Math.floor(Date.now() / 1000) : Math.floor(d.getTime() / 1000);
}

function fmt(v) {
  if (v == null) return "—";
  const n = Number(v);
  if (n < 10) return n.toFixed(5);
  if (n < 1000) return n.toFixed(2);
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function drawLevels(sig) {
  lines.forEach(l => series.removePriceLine(l));
  lines = [];
  if (sig.entry == null) return;
  lines.push(series.createPriceLine({ price: sig.entry, color: "#4f8cff",
    lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: "Entry" }));
  lines.push(series.createPriceLine({ price: sig.sl, color: "#ea3943",
    lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: "SL" }));
  lines.push(series.createPriceLine({ price: sig.tp1, color: "#16c784",
    lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: "TP1" }));
  lines.push(series.createPriceLine({ price: sig.tp2, color: "#16c784",
    lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "TP2" }));
}

async function analyze() {
  const symbol = document.getElementById("symbol").value.trim();
  const interval = document.getElementById("interval").value;
  const out = document.getElementById("output");
  out.innerHTML = '<div class="card">Loading…</div>';
  try {
    const r = await fetch(`/api/analyze?symbol=${encodeURIComponent(symbol)}&interval=${interval}`);
    const data = await r.json();
    if (!data.success) throw new Error(data.error);

    series.setData(data.candles.map(c => ({
      time: ts(c.time), open: c.open, high: c.high, low: c.low, close: c.close,
    })));
    chart.timeScale().fitContent();

    const s = data.signal;
    drawLevels(s);
    const cls = s.action === "BUY" ? "buy" : s.action === "SELL" ? "sell" : "wait";

    out.innerHTML = `
      <div class="card">
        <div class="action ${cls}">${s.action}</div>
        ${s.entry != null ? `
          <div class="row"><span class="lbl">Entry</span><b>${fmt(s.entry)}</b></div>
          <div class="row"><span class="lbl">Stop Loss</span><b style="color:#ea3943">${fmt(s.sl)}</b></div>
          <div class="row"><span class="lbl">Take Profit 1</span><b style="color:#16c784">${fmt(s.tp1)}</b></div>
          <div class="row"><span class="lbl">Take Profit 2</span><b style="color:#16c784">${fmt(s.tp2)}</b></div>
        ` : ""}
        <ul class="reasons">${s.reason.map(x => `<li>${x}</li>`).join("")}</ul>
      </div>
    `;
  } catch (e) {
    out.innerHTML = `<div class="card" style="color:#ea3943">Error: ${e.message}</div>`;
  }
}

initChart();
document.getElementById("analyze").addEventListener("click", analyze);
document.getElementById("symbol").addEventListener("keydown", e => {
  if (e.key === "Enter") analyze();
});
analyze();
</script>
</body>
</html>
